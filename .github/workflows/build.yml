name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests, and a real launch of the app, on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test --test-concurrency=1 --test-timeout=180000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci-reporter.mjs --test-reporter-destination=stdout "test/*.test.js"
      - name: launch the app (smoke test)
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npm run smoke
      - name: launch the app (smoke test, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb >/dev/null
          node build.mjs
          xvfb-run -a npx electron . --smoke-test --no-sandbox

  # Installers: wirdwatcher-setup-<version>.exe (Windows, x64 and ARM) and
  # .dmg (macOS, Apple silicon and Intel). The Mac app is signed ad hoc (Apple
  # silicon won't run it otherwise); real Developer ID signing and Windows
  # code signing need paid certificates, so SmartScreen and Gatekeeper ask first.
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_ENV: production
      # macOS refuses unsigned apps on Apple silicon ("damaged"). The build
      # signs ad hoc (free, no Apple account); check that it really did.
      - name: Check the Mac app is signed
        if: runner.os == 'macOS'
        run: |
          for app in release/mac*/wirdwatcher.app; do
            echo "::notice title=codesign::$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|flags'
          done
      # The apps update themselves from these; a release without them would
      # leave everyone on it stuck.
      - name: Check the update files are there
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -f release/latest-mac.yml
            for a in arm64 x64; do ls release/wirdwatcher-*-$a.zip; done
            grep -q 'arm64.zip' release/latest-mac.yml && grep -q 'x64.zip' release/latest-mac.yml
          else
            test -f release/latest.yml
            ls release/*.blockmap
            test -f release/win-unpacked/resources/app-update.yml
          fi
          cat release/*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: wirdwatcher-${{ runner.os }}
          # The installers, plus what the apps read to update themselves:
          # latest.yml / latest-mac.yml (versions and SHA-512s), the Mac
          # .zip (what the Mac app swaps in) and the blockmaps.
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  # The one-command installers, on clean machines.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\wirdwatcher\node_modules\.bin\electron.cmd")) { throw 'electron missing' }
          if (-not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\wirdwatcher.lnk'))) { throw 'shortcut missing' }
          Push-Location "$env:RUNNER_TEMP\wirdwatcher"
          & npm.cmd run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          WIRDWATCHER_REPO: ${{ github.workspace }}
          WIRDWATCHER_DIR: ${{ runner.temp }}\wirdwatcher
      - name: install.sh
        if: runner.os == 'macOS'
        run: |
          bash scripts/install.sh
          test -x "$RUNNER_TEMP/wirdwatcher/node_modules/.bin/electron"
          cd "$RUNNER_TEMP/wirdwatcher" && npm run smoke
        env:
          WIRDWATCHER_REPO: ${{ github.workspace }}
          WIRDWATCHER_DIR: ${{ runner.temp }}/wirdwatcher
          WIRDWATCHER_NO_SHORTCUT: '1'

  # Tagging a version (git tag v2.0.0 && git push --tags) publishes the
  # installers on the Releases page.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
